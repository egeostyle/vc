<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <!-- Halloween Section Background: Carved Pumpkins, Bats & Stars -->
  <g opacity="0.16">
    <!-- Pumpkin 1 (Bottom Right style) -->
    <g transform="translate(270, 235)">
      <!-- Stem -->
      <path d="M-4,-28 C-6,-40 6,-44 10,-38 C6,-34 3,-30 4,-26 Z" fill="#3f2e21"/>
      <!-- Pumpkin Ribs -->
      <ellipse cx="-18" cy="0" rx="18" ry="25" fill="#e65c00"/>
      <ellipse cx="18" cy="0" rx="18" ry="25" fill="#e65c00"/>
      <ellipse cx="-9" cy="2" rx="16" ry="27" fill="#f97316"/>
      <ellipse cx="9" cy="2" rx="16" ry="27" fill="#f97316"/>
      <ellipse cx="0" cy="3" rx="14" ry="28" fill="#fb923c"/>
      <!-- Jack-o'-lantern face -->
      <polygon points="-16,-8 -6,-8 -11,-18" fill="#23182b"/>
      <polygon points="16,-8 6,-8 11,-18" fill="#23182b"/>
      <polygon points="-3,-3 3,-3 0,-8" fill="#23182b"/>
      <path d="M-18,6 L-12,12 L-6,8 L0,14 L6,8 L12,12 L18,6 L14,17 L6,15 L0,19 L-6,15 L-14,17 Z" fill="#23182b"/>
    </g>

    <!-- Pumpkin 2 (Smaller, Top Left) -->
    <g transform="translate(65, 95) scale(0.72)">
      <path d="M-3,-26 C-5,-36 5,-40 8,-35 C5,-31 2,-28 3,-24 Z" fill="#3f2e21"/>
      <ellipse cx="-16" cy="0" rx="16" ry="23" fill="#d9531e"/>
      <ellipse cx="16" cy="0" rx="16" ry="23" fill="#d9531e"/>
      <ellipse cx="0" cy="2" rx="16" ry="25" fill="#f97316"/>
      <polygon points="-13,-6 -5,-6 -9,-15" fill="#23182b"/>
      <polygon points="13,-6 5,-6 9,-15" fill="#23182b"/>
      <path d="M-14,7 Q0,18 14,7 Q0,24 -14,7 Z" fill="#23182b"/>
    </g>

    <!-- Flying Bat 1 -->
    <g transform="translate(245, 75) rotate(-12)" fill="#2d1b38">
      <path d="M0,0 C-5,-8 -18,-14 -30,-6 C-22,-2 -18,4 -16,8 C-11,3 -6,5 0,10 C6,5 11,3 16,8 C18,4 22,-2 30,-6 C18,-14 5,-8 0,0 Z"/>
      <circle cx="0" cy="-2" r="3.5"/>
      <polygon points="-3,-4 -4,-9 -1,-5"/>
      <polygon points="3,-4 4,-9 1,-5"/>
    </g>

    <!-- Flying Bat 2 -->
    <g transform="translate(105, 235) rotate(14) scale(0.75)" fill="#6b21a8">
      <path d="M0,0 C-5,-8 -18,-14 -30,-6 C-22,-2 -18,4 -16,8 C-11,3 -6,5 0,10 C6,5 11,3 16,8 C18,4 22,-2 30,-6 C18,-14 5,-8 0,0 Z"/>
      <circle cx="0" cy="-2" r="3.5"/>
    </g>

    <!-- Crescent Moon & Sparkles -->
    <path d="M175,45 A18,18 0 1,0 195,68 A14,14 0 1,1 175,45 Z" fill="#e65c00"/>
    <circle cx="140" cy="145" r="2.5" fill="#6b21a8"/>
    <circle cx="310" cy="145" r="2" fill="#e65c00"/>
    <circle cx="45" cy="195" r="2.5" fill="#e65c00"/>
  </g>
</svg>
