<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Dia de la Madre Section Watermark: Peony Wreath & Heart Botanical -->
  <g opacity="0.16">
    <!-- Botanical Wreath & Peony at (240, 230) -->
    <g transform="translate(240, 230)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#d4a373" stroke-width="1.8" stroke-dasharray="4,3"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#a8556f" stroke-width="1"/>
      <!-- Peony on wreath -->
      <g transform="translate(-28, 26)">
        <circle cx="-5" cy="-3" r="8" fill="#f472b6"/>
        <circle cx="5" cy="-3" r="8" fill="#f472b6"/>
        <circle cx="0" cy="5" r="8" fill="#ec4899"/>
        <circle cx="0" cy="-1" r="4" fill="#fbbf24"/>
      </g>
      <!-- Leaves -->
      <path d="M-40,10 C-52,0 -48,-15 -38,-8" fill="#84a98c"/>
      <path d="M-10,38 C0,50 15,46 8,36" fill="#84a98c"/>
    </g>
    <!-- Delicate Blossom at (75, 85) -->
    <g transform="translate(75, 85)">
      <circle cx="-6" cy="-4" r="9" fill="#f9a8d4"/>
      <circle cx="6" cy="-4" r="9" fill="#f9a8d4"/>
      <circle cx="-6" cy="5" r="9" fill="#f472b6"/>
      <circle cx="6" cy="5" r="9" fill="#f472b6"/>
      <circle cx="0" cy="0" r="4.5" fill="#d4a373"/>
    </g>
